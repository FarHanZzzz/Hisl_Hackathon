# Render Blueprint Specification
# See https://render.com/docs/blueprints for details
services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend (Docker Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: pedi-growth-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false # Set in the Render Dashboard after deployment
      - key: SUPABASE_KEY
        sync: false # Set in the Render Dashboard after deployment
      - key: OPENROUTER_API_KEY
        sync: false # Optional: Set in the Render Dashboard if using AI Clinical Summary
      - key: OPENROUTER_MODEL
        value: google/gemini-3.1-pro-preview
      - key: PORT
        value: 8000

  # ---------------------------------------------------------------------------
  # 2. Next.js Frontend (Node.js Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: pedi-growth-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      # Automatically link the frontend to the backend URL generated by Render
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: pedi-growth-backend
          type: web
          property: url
